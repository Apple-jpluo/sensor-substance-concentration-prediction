[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statsml-temporal-shift"
version = "0.1.0"
description = "Official implementation of sensor classification and concentration prediction under temporal distribution shift"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = [
  "numpy==2.2.5",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
